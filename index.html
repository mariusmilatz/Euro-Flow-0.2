<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Euro Flow</title>
  <meta name="description" content="Online board game about money, assets and the German tax system. Escape the hamster wheel and get on the fast track!">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐹</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <!-- START -->
  <section id="start" class="screen hero">
    <div class="langs"><button data-lang="en">EN</button><button data-lang="de">DE</button></div>
    <div class="herobox">
      <div class="logo"><span class="ham">🐹</span><h1>EURO<span>€</span>FLOW</h1><p class="tag" data-i18n="tagline"></p></div>
      <label class="field"><span data-i18n="yourName"></span><input id="name" maxlength="16" data-i18n-ph="namePh"></label>
      <p id="join-hint" class="hint" hidden data-i18n="invited"></p>
      <div class="choices">
        <div class="choice">
          <h3 data-i18n="playLocal"></h3>
          <button class="btn big gold" id="btn-local" data-i18n="localBtn"></button>
          <p class="fine" data-i18n="localHint"></p>
          <button class="btn ghostlight" id="btn-resume" hidden data-i18n="resume"></button>
        </div>
        <div class="choice">
          <h3 data-i18n="playOnline"></h3>
          <button class="btn big" id="btn-host" data-i18n="createGame"></button>
          <div class="joinrow"><input id="joincode" maxlength="5" placeholder="CODE"><button class="btn" id="btn-join" data-i18n="join"></button></div>
          <p class="fine" data-i18n="onlineHint"></p>
        </div>
      </div>
      <button class="link" data-rules data-i18n="rulesLink"></button>
    </div>
  </section>

  <section id="connecting" class="screen hero" hidden><div class="herobox"><div class="spinner"></div><p data-i18n="connecting"></p></div></section>

  <!-- LOBBY -->
  <section id="lobby" class="screen hero" hidden>
    <div class="langs"><button data-lang="en">EN</button><button data-lang="de">DE</button></div>
    <div class="herobox wide">
      <div class="logo small"><span class="ham">🐹</span><h1>EURO<span>€</span>FLOW</h1></div>
      <div id="lobby-invite" hidden class="invite">
        <div><span data-i18n="roomCode"></span> <b id="room-code"></b></div>
        <div class="joinrow"><input id="invite-link" readonly><button class="btn" id="copy-link" data-i18n="copyLink"></button></div>
        <p class="fine" data-i18n="inviteHint"></p>
      </div>
      <div id="lobby-mode" class="lobbymode"></div>
      <h3 data-i18n="players"></h3>
      <div id="lobby-alllvl" class="lobbymode"></div>
      <div id="lobby-players"></div>
      <div class="addrows">
        <div class="joinrow" id="lobby-botrow">
          <button class="btn" id="lobby-addbot" data-i18n="addBot"></button>
        </div>
        <div class="joinrow"><input id="lobby-name" maxlength="16" data-i18n-ph="addHumanPh"><button class="btn ghostlight" id="lobby-add" data-i18n="addHuman"></button></div>
      </div>
      <label class="coachopt"><input type="checkbox" id="lobby-coach"> <span data-i18n="assistOpt"></span></label>
      <p class="fine light" data-i18n="lobbyHint"></p>
      <button class="btn big gold" id="lobby-start" data-i18n="startGame"></button>
      <p id="lobby-wait" class="hint" hidden data-i18n="waitHost"></p>
      <button class="link" data-rules data-i18n="rules"></button>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="screen" hidden>
    <header class="topbar">
      <div class="brand">🐹 EURO<span>€</span>FLOW</div>
      <div id="players" class="hplayers"></div>
      <div class="tb">
        <span id="netstatus"></span>
        <div class="logwrap"><button class="pill" id="log-toggle"></button>
          <div id="logpanel" class="logpanel" hidden><div class="logbar"><span id="logfilter-label"></span><select id="logfilter"></select></div><div id="log"></div></div></div>
        <button class="pill" id="coach-toggle"></button>
        <span class="langs inline"><button data-lang="en">EN</button><button data-lang="de">DE</button></span>
        <button class="link" data-rules data-i18n="rules"></button>
        <button class="link" id="btn-leave" data-i18n="menu"></button>
      </div>
    </header>
    <main class="layout">
      <div class="boardwrap">
        <div id="board"></div>
        <div id="card" class="gamecard" hidden></div>
        <div id="turn" class="tray"></div>
        <div id="coach" class="coach coachbox" hidden></div>
      </div>
      <aside class="side">
        <div id="sheet" class="panel sheet"></div>
      </aside>
    </main>
    <div id="winner" class="overlay" hidden></div>
  </section>

  <!-- RULES -->
  <div id="rules" class="overlay" hidden>
    <div class="rulesbox">
      <button class="x" id="rules-close">✕</button>
      <div id="rules-content"></div>
    </div>
  </div>

  <div id="toasts"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
